name: runner watch
# Manual only: check for jobs waiting over 2 hours for a self-hosted runner.
# Runs on GitHub-hosted runners; automatic monitoring is disabled in this fork.
#   gh workflow run "runner watch" -f dry_run=true
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what it would do with the issue
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: runner-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Jobs waiting for a self-hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/runner_watch.py ${{ inputs.dry_run && '--dry-run' || '' }}
